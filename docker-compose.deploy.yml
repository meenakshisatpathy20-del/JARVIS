# Hosted demo: docker compose -f docker-compose.yml -f docker-compose.deploy.yml up -d --build
# Adds a Caddy reverse proxy so the whole demo is one public URL, on port 8000 by default
# (the proxy takes over 8000; J.A.R.V.I.S. itself is then reachable only through the proxy).
# J.A.R.V.I.S. and chaos still share no network with each other: the proxy sits on two separate
# edge networks, and the hidden truth stays protected by signed commit-then-reveal.
services:
  # restart everything automatically after a VM reboot (a container chaos stops on purpose stays stopped)
  user-db: { restart: unless-stopped }
  auth-service: { restart: unless-stopped }
  payment-service: { restart: unless-stopped }
  gateway: { restart: unless-stopped }
  loadgen: { restart: unless-stopped }

  jarvis:
    restart: unless-stopped
    environment:
      CHAOS_PUBLIC_URL: /chaos
    ports: !reset []
    networks: [jarvisnet, edge_jarvis]

  chaos:
    restart: unless-stopped
    networks: [chaosnet, edge_chaos]

  edge:
    image: caddy:2.8
    container_name: jarvis-edge
    restart: unless-stopped
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
    ports:
      - "${PUBLIC_HTTP_PORT:-8000}:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
    depends_on: [jarvis, chaos]
    networks: [edge_jarvis, edge_chaos]

networks:
  edge_jarvis: {}
  edge_chaos: {}

volumes:
  caddy-data: {}
