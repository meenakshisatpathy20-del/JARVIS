# Hosted demo: docker compose -f docker-compose.yml -f docker-compose.deploy.yml up -d --build
# Adds a Caddy reverse proxy so the whole demo is one public URL.
# J.A.R.V.I.S. and chaos still share no network with each other: the proxy sits on two separate
# edge networks, and the hidden truth stays protected by signed commit-then-reveal.
services:
  jarvis:
    environment:
      CHAOS_PUBLIC_URL: /chaos
    networks: [jarvisnet, edge_jarvis]

  chaos:
    networks: [chaosnet, edge_chaos]

  edge:
    image: caddy:2.8
    container_name: jarvis-edge
    restart: unless-stopped
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
    ports:
      - "${PUBLIC_HTTP_PORT:-80}:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
    depends_on: [jarvis, chaos]
    networks: [edge_jarvis, edge_chaos]

networks:
  edge_jarvis: {}
  edge_chaos: {}

volumes:
  caddy-data: {}
